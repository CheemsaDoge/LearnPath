[project]
name = "learnpath-backend"
version = "0.1.0"
description = "LearnPath (知径) — turn Zhihu's best answers into a personal learning path. FastAPI backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "anthropic>=1.5,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
